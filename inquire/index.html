<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inquiry | Volt Painters</title>

  <link rel="icon" type="image/jpeg" href="/images/logo.png">

  <link rel="stylesheet"
        href="../inquire.css">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

<body>

<div class="inquire-container">

  <img src="../images/logo.png"
       alt="Volt Painters Logo"
       class="logo">

  <p class="small-title">
    VOLT PAINTERS
  </p>

  <h1>
    Get Professional Painting Services
  </h1>

  <p class="description">
    Fill out the form below and our team
    will contact you as soon as possible.
  </p>

  <form id="inquiryForm">

      <input type="text"
             name="name"
             placeholder="Name"
             required>

      <input type="text"
             name="phone"
             placeholder="Phone Number"
             required>

      <input type="email"
             name="email"
             placeholder="Email Address"
             required>

      <input type="text"
             name="address"
             placeholder="Address"
             required>

      <textarea name="message"
                placeholder="What do you need help with?"
                required></textarea>

      <button type="submit">
        Submit Inquiry
      </button>

  </form>

  <a href="/"
     class="back-home">

     ← Back To Home

  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init("e0rWXX_m3GdtbfQDk");

const form =
document.getElementById("inquiryForm");

form.addEventListener("submit", function(e){

  e.preventDefault();

  emailjs.sendForm(
    "service_he0bpu9",
    "template_m1ynf2w",
    this
  )

  .then(() => {

    alert("Inquiry Sent Successfully!");

    form.reset();

  })

  .catch((error) => {

    alert("Failed To Send Inquiry");

    console.log(error);

  });

});

</script>

</body>
</html>
