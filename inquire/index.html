<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Inquiry | Volt Painters</title>

  <link rel="stylesheet"
        href="../inquire.css">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="inquire-container">

<img src="../images/logo.png"
     alt="Volt Painters Logo"
     class="logo">

  <p class="small-title">
    VOLT PAINTERS
  </p>

  <h1>
    Request A Quote
  </h1>

  <p class="description">
    Fill out the form below and our team
    will contact you as soon as possible.
  </p>

<form action="https://formsubmit.co/office@voltpainters.co.nz"
      method="POST">

  <input type="hidden"
         name="_captcha"
         value="false">

  <input type="hidden"
         name="_next"
         value="https://voltpainters.co.nz/">

  <input type="text"
         name="name"
         placeholder="Full Name"
         required>

  <input type="email"
         name="email"
         placeholder="Email Address"
         required>

  <input type="text"
         name="phone"
         placeholder="Phone Number"
         required>

  <textarea name="message"
            placeholder="Tell us about your project"
            required></textarea>

  <button type="submit">
    Submit Inquiry
  </button>

</form>

  <a href="/"
     class="back-home">

     ← Back To Home

  </a>

</div>

</body>
</html>
